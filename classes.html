<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>班级与学员名单</title><style>body{font:16px system-ui;max-width:950px;margin:2em auto;padding:0 1em;color:#18243a}section{border:1px solid #ddd;border-radius:10px;padding:1em;margin:1em 0}label{display:inline-block;margin:.4em}input,select,button{font:inherit;padding:.4em}button{cursor:pointer}#message{white-space:pre-wrap;color:#a22}li{margin:.5em}</style></head><body><p><a href="/">返回管理首页</a></p><h1>班级与学员名单</h1><p id="message" role="status"></p><section id="editor" hidden><h2>新建或编辑班级</h2><form id="form"><input id="classId" type="hidden"><label>班级名称 <input id="name" required maxlength="100"></label><label>公司/部门 <select id="org" required></select></label><label>专业/等级 <select id="standard"></select></label><label>班主任 <select id="teacher"></select></label><button>保存</button><button type="button" id="reset">新建</button></form></section><section><h2>班级列表</h2><ul id="classes"></ul></section><section id="rosterSection" hidden><h2 id="rosterTitle">学员名单</h2><p><a href="/api/classes/template">下载 CSV 模板</a> · <a id="export">导出名单 CSV</a></p><div id="rosterEdit"><p>使用已创建的学生账号（手机号），每行一个；导入会保留现有名单。</p><input type="file" id="file" accept=".csv,text/csv"><button id="import">导入 CSV</button><label>学生账号 <input id="student"></label><button id="add">添加</button></div><ul id="roster"></ul></section><section id="theorySection" hidden><h2>线上理论考试</h2><form id="planForm" hidden><label>试卷 <select id="planPaper" required></select></label><button>创建考试计划</button></form><p>先在管理首页完成题目与试卷发布，再按班级名单分配试卷；确认工位和考生身份后放卷。</p><button id="refreshPlans">刷新计划与成绩</button><ul id="plans"></ul><div id="classScores" role="status"></div></section><script>
let selected=null,items=[],options=null;const $=id=>document.getElementById(id),message=$('message');
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Classroom-Request':'class-management'},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||'操作失败');return data}
function showError(e){message.textContent=e.message}function select(id,arr,label,empty){const el=$(id);el.replaceChildren();if(empty)el.add(new Option(empty,''));for(const x of arr)el.add(new Option(label(x),x.id||x.username))}
async function load(){items=await api('/api/classes');$('classes').replaceChildren(...items.map(c=>{const li=document.createElement('li'),button=document.createElement('button');button.textContent=c.name;button.onclick=()=>openRoster(c);li.append(button);if(options){const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>{for(const [k,v] of Object.entries({classId:c.id,name:c.name,org:c.orgId,standard:c.standardId||'',teacher:c.teacher||''}))$(k).value=v;window.scrollTo(0,0)};li.append(' ',edit)}return li}))}
async function openRoster(c){selected=c;await openPlans(c);$('rosterSection').hidden=false;$('rosterTitle').textContent=c.name+' · 学员名单';$('export').href='/api/classes/'+c.id+'/export';$('rosterEdit').hidden=!options;const rows=await api('/api/classes/'+c.id+'/roster');$('roster').replaceChildren(...rows.map(x=>{const li=document.createElement('li');li.textContent=(x.name||'')+' '+x.username+(x.disabled?'（已停用）':'');if(options){const b=document.createElement('button');b.textContent='移除';b.onclick=async()=>{try{await api('/api/classes/'+c.id+'/roster','DELETE',{username:x.username});await openRoster(c)}catch(e){showError(e)}};li.append(' ',b)}return li}))}
$('form').onsubmit=async e=>{e.preventDefault();try{const id=$('classId').value;await api('/api/classes'+(id?'/'+id:''),id?'PUT':'POST',{name:$('name').value,orgId:$('org').value,standardId:$('standard').value,teacher:$('teacher').value});$('form').reset();$('classId').value='';message.textContent='已保存';await load()}catch(e){showError(e)}};$('reset').onclick=()=>{$('form').reset();$('classId').value=''};
async function planApi(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Classroom-Request':'class-exam-plan'},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||'考试操作失败');return data}
async function showScores(plan){const result=await planApi('/api/class-exam-plans/'+plan.id+'/scores');if(selected?.id!==result.classId)return;const table=document.createElement('table'),head=document.createElement('tr');for(const title of ['学员账号','版本','答卷状态','成绩']){const th=document.createElement('th');th.textContent=title;head.append(th)}table.append(head);const states={not_started:'未开始',inprogress:'答题中',overdue:'已超时',finished:'已交卷',abandoned:'已放弃'};for(const row of result.students){const tr=document.createElement('tr');for(const value of [row.username,row.version,states[row.state]||row.state,row.score===null?(row.state==='finished'?'待评分':'—'):row.score+' / '+row.maxScore]){const td=document.createElement('td');td.textContent=value;tr.append(td)}table.append(tr)}const title=document.createElement('h3');title.textContent=result.name+' · 班级理论成绩';$('classScores').replaceChildren(title,table)}
async function openPlans(c){$('theorySection').hidden=false;$('classScores').replaceChildren();const plans=await planApi('/api/class-exam-plans');if(selected?.id!==c.id)return;$('plans').replaceChildren(...plans.filter(p=>p.classId===c.id).map(p=>{const li=document.createElement('li');const statuses={running:'处理中',prepared:'已分配',unknown:'结果待核实',open:'已放卷'};li.textContent=p.name+' · '+(statuses[p.release?.status||p.assignment?.status]||'待分配');function button(label,action,enabled){const b=document.createElement('button');b.type='button';b.textContent=label;b.disabled=!enabled;b.onclick=async()=>{b.disabled=true;try{await action();if(label!=='班级成绩'){message.textContent='操作已受理，请刷新查看结果';await openPlans(c)}}catch(e){showError(e)}finally{b.disabled=!enabled}};li.append(' ',b)}if(options){button('分配试卷',()=>planApi('/api/class-exam-plans/'+p.id+'/assign','POST'),!p.assignment);button('放卷',()=>planApi('/api/class-exam-plans/'+p.id+'/release','POST'),p.assignment?.status==='prepared'&&!p.release)}button('班级成绩',()=>showScores(p),p.assignment?.status==='prepared');return li}));if(options){const papers=await planApi('/api/class-exam-plans/options');select('planPaper',papers,x=>x.name);$('planForm').hidden=false}}
$('planForm').onsubmit=async e=>{e.preventDefault();try{await planApi('/api/class-exam-plans','POST',{classId:selected.id,paperId:$('planPaper').value});await openPlans(selected);message.textContent='考试计划已创建'}catch(e){showError(e)}};$('refreshPlans').onclick=()=>selected&&openPlans(selected).catch(showError);
async function add(usernames){await api('/api/classes/'+selected.id+'/roster','POST',{usernames});await openRoster(selected);message.textContent='名单已更新'}$('add').onclick=()=>add([$('student').value.trim()]).catch(showError);$('import').onclick=async()=>{try{const file=$('file').files[0];if(!file||file.size>100000)throw Error('请选择不超过 100 KB 的 CSV');const lines=(await file.text()).replace(/^\ufeff/,'').split(/\r?\n/);if(lines.shift().trim()!=='username')throw Error('请使用名单模板，首行为 username');const names=lines.map(x=>x.trim()).filter(Boolean);if(names.some(x=>!/^1[3-9]\d{9}$/.test(x)))throw Error('名单只接受学生手机号，每行一个');await add(names)}catch(e){showError(e)}};
(async()=>{try{try{options=await api('/api/classes/options');$('editor').hidden=false;select('org',options.org,x=>x.name);select('standard',options.standards,x=>x.occupation+' / '+x.level+'级','无');select('teacher',options.accounts.filter(x=>x.role==='class_teacher'),x=>(x.name||'')+' '+x.username,'未设置')}catch{}await load()}catch(e){showError(e)}})();
</script></body></html>
