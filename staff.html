<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考务管理登录</title><style>body{font:16px system-ui;background:#eff4f7;color:#1b3445;display:grid;place-items:center;min-height:100vh;margin:0}main{background:#fff;padding:36px;border-radius:18px;width:min(360px,80vw);box-shadow:0 15px 45px #1232}label{display:block;margin:20px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cad8df;border-radius:8px;font:inherit}button{background:#175a66;color:white;border:0;margin-top:24px;cursor:pointer}#status{min-height:25px;color:#a43434}</style></head><body><main><h1>考务管理登录</h1><p>使用管理员分配的考务或考评员账号。</p><form id="login"><label for="username">账号</label><input id="username" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button>登录</button></form><p id="status" role="status"></p></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const status=document.querySelector('#status');status.textContent='正在登录…';try{const r=await fetch('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json','X-Classroom-Request':'staff-login'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(!r.ok)throw Error();location.href='/'}catch{status.textContent='登录失败，请检查账号和密码。'}})</script></body></html>
