<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考务管理登录</title><style>body{font:16px system-ui;background:#eff4f7;color:#1b3445;display:grid;place-items:center;min-height:100vh;margin:0}main{background:#fff;padding:36px;border-radius:18px;width:min(420px,92vw);box-shadow:0 15px 45px #1232}label{display:block;margin:20px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cad8df;border-radius:8px;font:inherit}button{background:#175a66;color:white;border:0;margin-top:24px;cursor:pointer}#status{min-height:25px;color:#a43434}hr{border:0;border-top:1px solid #e1ebf0;margin:28px 0}</style></head><body><main><h1>考务管理登录</h1><p>管理员使用账号。班主任和讲师使用手机号。考评员使用姓名、身份证和手机号。</p><form id="login"><label for="username">账号或手机号</label><input id="username" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button>登录</button></form><hr><form id="examiner-login"><label for="examiner-name">姓名</label><input id="examiner-name" autocomplete="name" required><label for="examiner-id">身份证</label><input id="examiner-id" autocomplete="off" required><label for="examiner-phone">手机号</label><input id="examiner-phone" autocomplete="tel" inputmode="numeric" required><button>考评员登录</button></form><p id="status" role="status"></p></main><script>async function staffLogin(body,wrong){const status=document.querySelector('#status');status.textContent='正在登录…';const r=await fetch('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json','X-Classroom-Request':'staff-login'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error();if(data.role==='student'){await fetch('/api/staff/logout',{method:'POST',headers:{'X-Classroom-Request':'staff-logout'}});status.textContent='学员请使用考生页面的手机号登录。';return}if(wrong&&wrong(data)){await fetch('/api/staff/logout',{method:'POST',headers:{'X-Classroom-Request':'staff-logout'}});throw Error()}location.href='/'}document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();try{await staffLogin({username:document.querySelector('#username').value,password:document.querySelector('#password').value})}catch{document.querySelector('#status').textContent='登录失败，请检查账号和密码。'}});document.querySelector('#examiner-login').addEventListener('submit',async e=>{e.preventDefault();try{await staffLogin({name:document.querySelector('#examiner-name').value,idNumber:document.querySelector('#examiner-id').value,phone:document.querySelector('#examiner-phone').value},data=>data.role!=='examiner'||data.scope!=='unfinished-scoring')}catch{document.querySelector('#status').textContent='登录失败，请检查姓名、身份证和手机号。'}})</script></body></html>
